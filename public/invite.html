<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1126" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Meldiq invitation</title>
    <link rel="icon" href="/favicon-32.png" />
    <style>
      :root { --bg: #f4f6fb; --card: #ffffff; --text: #121933; --muted: #4f5878; --accent: #3a5bd9; --accent-text: #ffffff; --line: #e1e6f0; --warn: #8a5a00; }
      @media (prefers-color-scheme: dark) { :root { --bg: #070b18; --card: #10172b; --text: #eef2ff; --muted: #a9b3d4; --accent: #7aa2ff; --accent-text: #0a1230; --line: #1f2944; --warn: #f0c060; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      @media (prefers-reduced-motion: no-preference) { main { animation: rise 260ms cubic-bezier(0.05, 0.7, 0.1, 1); } @keyframes rise { from { opacity: 0; transform: translateY(8px); } } }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      h1 { font-size: 1.4rem; margin: 14px 0 4px; overflow-wrap: anywhere; }
      p { margin: 6px 0; color: var(--muted); overflow-wrap: anywhere; }
      .code { font: 600 1.1rem ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--text); margin: 16px 0 4px; }
      .actions { display: grid; gap: 10px; margin-top: 20px; }
      a.button, button { display: block; width: 100%; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
      .warn { color: var(--warn); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img src="/meldiq-mascot-192.webp" alt="" width="72" height="72" />
      <p id="lead">You've been invited to a community on Meldiq</p>
      <h1 id="name">Loading…</h1>
      <p id="about" hidden></p>
      <p id="members" hidden></p>
      <p id="problem" class="warn" hidden></p>
      <div id="join" hidden>
        <div class="code" id="code"></div>
        <div class="actions">
          <a class="button primary" id="open-web" href="/">Join in Meldiq Web</a>
          <a class="button" id="open-app" href="#">Open in the Meldiq app</a>
          <button type="button" id="copy">Copy the code</button>
        </div>
        <p style="margin-top: 14px; font-size: 0.9rem">Not signed in yet? Sign in or create an account first: you'll come back to this community.</p>
      </div>
    </main>
    <script src="/invite.js"></script>
  </body>
</html>
