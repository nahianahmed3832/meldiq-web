name: Meldiq production export
on:
  push:
    branches: [codex/static-export-20261115]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_MELDIQ_TEST_LINKING: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm exec -- vitest run test/call-controls.test.ts test/call-setup.test.ts test/share-quality.test.ts --maxWorkers=2
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meldiq-web-production
          path: dist/
          retention-days: 1
